name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # The analyzer and the web app share one schema, so a broken analyzer should
  # block the deploy just as a broken build would. Windows, because the GUI
  # tests need a display and the elevation checks are Windows-only.
  analyzer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: analyzer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: python -m pip install pytest

      - name: Test
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    needs: analyzer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The contract test runs the analyzer against the synthetic image and
      # validates its output against the schema generated from case.ts.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: npm test
        env:
          PYTHON: python

      - name: Build
        run: npm run build
        env:
          VITE_BASE_URL: /ForensicaLite/

      # GitHub Pages has no rewrite rules, so a direct hit on /results would
      # 404. Serving index.html as the 404 document lets the SPA router
      # resolve the path client-side.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
